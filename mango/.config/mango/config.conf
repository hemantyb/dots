# trials


########

exec_once=waybar
exec_once=swaybg -i ~/wallpapers/wallpaper.jpg
exec_once=wlsunset -S 06:00 -s 17:00 -T 6500 -t 4000

blur=1
blur_layer = 1
blur_optimized = 0
blur_params_num_passes = 2
blur_params_radius = 5

focused_opacity=0.9
unfocused_opacity=0.8

gap_inner_horizontal=10
gap_inner_vertical=10
gap_outer_horizontal=10
gap_outer_vertical=10
border_px=3

focus_color = 0xb153a7ff
global_color = 0x516c93ff 

xkb_rules_layout=us

tag_rule=id:1,layout_name:scroller
tag_rule=id:2,layout_name:vertical_scroller

source=./bind.conf
